apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc
  namespace: cowork
spec:
  selector:
    matchLabels:
      app: doc
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: doc
    spec:
      initContainers:
        - name: wait-for-services
          image: alpine:3.16
          command:
            - sh
            - -c
            - |
              until nc -vz db-doc-service 27017; do echo waiting for db-doc-service; sleep 2; done;
              until nc -vz nats-service 4222; do echo waiting for nats-service; sleep 2; done;
      containers:
        - name: doc
          image: cowork-doc:latest
          imagePullPolicy: Never
          env:
            - name: PROFILE
              value: "k8s"
          envFrom:
            - secretRef:
                name: doc-db-url
            - secretRef:
                name: nats-url
          volumeMounts:
            - name: app-config
              mountPath: /etc/app/
          ports:
            - containerPort: 8080
            - containerPort: 9090
              name: grpc
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-config
          configMap:
            name: doc-config

---

apiVersion: v1
kind: Service
metadata:
  name: doc-service
  namespace: cowork
spec:
  type: NodePort
  selector:
    app: doc
  ports:
    - protocol: "TCP"
      port: 8080
      targetPort: 8080
      name: http
    - protocol: "TCP"
      port: 9090
      targetPort: 9090
      name: grpc

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doc-hpa
  namespace: cowork
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doc
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: 70
          type: AverageValue