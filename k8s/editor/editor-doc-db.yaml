---

kind: ConfigMap
apiVersion: v1
metadata:
  name: db-doc-script
  namespace: editor
data:
  init.sh: |
    until mongosh --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)' &>/dev/null; do echo "waiting db"; sleep 5; done
    if [[ "$(hostname)" =~ ^[a-z-]+0 ]]; then
      mongosh -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --eval \
      "rs.initiate({\"_id\":\"rs0\",\"members\":[{\"_id\":0,\"host\":\"$(hostname -f):27017\"}]})"
    else
      mongosh mongodb://$(hostname -f | sed -e 's/[0-9]\./0./'):27017 -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --eval \
      "rs.add('$(hostname -f):27017')"
    fi
  start.sh: |
    cp /tmp/key/replica.key /data/security/replica.key
    chmod 400 /data/security/replica.key
    chown 999:999 /data/security/replica.key
    bash /tmp/script/init.sh &
    docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/security/replica.key

---

apiVersion: v1
kind: Service
metadata:
  name: db-doc-service
  namespace: editor
spec:
  selector:
    app: db-doc
  ports:
    - port: 27017
      targetPort: 27017

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-doc
  namespace: editor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db-doc
  serviceName: db-doc-service
  template:
    metadata:
      labels:
        app: db-doc
    spec:
      containers:
        - name: mongo
          image: mongo:7.0.2
          imagePullPolicy: IfNotPresent
          command: [bash, /tmp/script/start.sh]
          readinessProbe:
            exec:
              command:
                - echo
                - db.runCommand("ping").ok
                - '|'
                - mongosh
                - localhost:27017/test
                - --quiet
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
          env:
            - name: MONGO_INITDB_DATABASE
              value: "editor_doc"
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "doc"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PASSWORD
                  name: db-doc-secret
          volumeMounts:
            - name: key-dir
              mountPath: /data/security
            - name: db-script
              mountPath: /tmp/script
            - name: db-doc-data
              mountPath: /data/db
            - name: db-doc-secret
              mountPath: /tmp/key
      volumes:
        - name: key-dir
          emptyDir: {}
        - name: db-script
          configMap:
            name: db-doc-script
        - name: db-doc-secret
          secret:
            secretName: db-doc-secret
  volumeClaimTemplates:
    - metadata:
        name: db-doc-data
        namespace: editor
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 128Mi
