syntax = "proto3";

package api;

option go_package = "/api";
option java_multiple_files = true;
option java_package = "doc.api";

import "google/protobuf/wrappers.proto";

service DocService {
    rpc findContentByDid(google.protobuf.StringValue) returns (DocContent) {}
}

message DocContent {
    bytes data = 1;
}