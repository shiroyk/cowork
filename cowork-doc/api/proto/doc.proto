syntax = "proto3";

package api;

option go_package = "/api";
option java_multiple_files = true;
option java_package = "doc.api";

service DocService {
    rpc findContent(DocContentReq) returns (DocContent) {}
}

message DocContentReq {
    string did = 1;
    string uid = 2;
}

message DocContent {
    bytes data = 1;
    int32 client_id = 2;
}